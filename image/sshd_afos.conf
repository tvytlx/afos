# ssh is a frontend, not a way past the agent.
#
# afos claims the agent is the only interactive entry. On any real cloud that
# claim is false by default: cloud-init writes the provider's key into
# /root/.ssh/authorized_keys and sshd is socket-activated, so port 22 is a root
# shell that never touches afosd. This file makes ssh what the architecture
# always said it was -- another frontend onto the same session.
#
# Dropped into /etc/ssh/sshd_config.d/, which the stock Ubuntu sshd_config
# includes before its own defaults.

# The only thing an ssh session can become.
#
# ForceCommand in sshd_config -- not a command= option in authorized_keys --
# because it applies to every key, including the one a cloud provider injects
# into /root/.ssh/authorized_keys without asking. That is precisely the key
# this is defending against.
ForceCommand /usr/local/bin/afos-console --wait

# prohibit-password, NOT forced-commands-only. Despite the name,
# forced-commands-only means "only if the KEY carries a command= option" and
# ignores ForceCommand entirely -- sshd's privsep monitor then kills the
# session with "fatal: monitor_child_preauth: unexpected authentication".
# prohibit-password allows key auth for root and lets ForceCommand above be
# what constrains it.
PermitRootLogin prohibit-password

# ForceCommand is not a boundary on its own: without these, the same key opens
# a file transfer, a tunnel, or an X11 channel, and none of them go through the
# agent.
Subsystem sftp /bin/false
AllowTcpForwarding no
AllowAgentForwarding no
AllowStreamLocalForwarding no
GatewayPorts no
X11Forwarding no
PermitTunnel no
PermitUserRC no
PermitUserEnvironment no

# The console is interactive; it needs a tty and nothing else.
PermitTTY yes

# No passwords anywhere. Keys are the only credential, and break-glass is the
# only path that does not need one.
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitEmptyPasswords no
